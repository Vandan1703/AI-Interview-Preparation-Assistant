<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#f6f8fd"/><text x="100" y="105" font-family="Arial" font-size="18" font-weight="700" fill="#223a70" letter-spacing="2">LANGGRAPH-POWERED PRACTICE</text><text x="100" y="170" font-family="Arial" font-size="54" font-weight="700" fill="#182132">Think like an interviewer.</text><text x="100" y="205" font-family="Arial" font-size="20" fill="#667085">Get a clear path to the solution—without code or spoilers.</text>
<rect x="100" y="250" width="1080" height="180" rx="18" fill="white" stroke="#e7eaf0"/><text x="126" y="286" font-family="Arial" font-size="16" font-weight="700" fill="#182132">Your interview question</text><rect x="126" y="305" width="1028" height="75" rx="10" fill="#fff" stroke="#cdd5e1"/><text x="143" y="349" font-family="Arial" font-size="16" fill="#667085">Given a string, find the longest substring without repeating characters.</text><rect x="940" y="392" width="214" height="28" rx="8" fill="#223a70"/><text x="965" y="412" font-family="Arial" font-size="13" font-weight="700" fill="white">Analyze question →</text>
<g font-family="Arial"><rect x="100" y="465" width="250" height="150" rx="18" fill="#e9f0ff" stroke="#e7eaf0"/><text x="124" y="497" font-size="12" font-weight="700" fill="#223a70">DIFFICULTY</text><text x="124" y="543" font-size="27" font-weight="700" fill="#182132">Medium</text><rect x="370" y="465" width="250" height="150" rx="18" fill="#e9f0ff" stroke="#e7eaf0"/><text x="394" y="497" font-size="12" font-weight="700" fill="#223a70">PRIMARY PATTERN</text><text x="394" y="543" font-size="27" font-weight="700" fill="#182132">Sliding Window</text><rect x="640" y="465" width="250" height="150" rx="18" fill="white" stroke="#e7eaf0"/><text x="664" y="497" font-size="12" font-weight="700" fill="#223a70">TIME COMPLEXITY</text><text x="664" y="543" font-size="27" font-weight="700" fill="#182132">O(n)</text><rect x="910" y="465" width="270" height="150" rx="18" fill="white" stroke="#e7eaf0"/><text x="934" y="497" font-size="12" font-weight="700" fill="#223a70">SPACE COMPLEXITY</text><text x="934" y="543" font-size="27" font-weight="700" fill="#182132">O(min(n, Σ))</text></g>
</svg>
